name: Copyright headers

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check canonical source file headers
        shell: pwsh
        run: ./eng/copyright/Manage-CopyrightHeaders.ps1 -Mode Check
